<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found ｜_entropy 熵序</title>
  <meta name="description" content="你访问的页面不存在或已被移动。">
  <meta name="theme-color" content="#0B0B0B">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/entropy-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Barlow:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('themePref');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main-404.tsx"></script>
</body>
</html>
